Description: |-
  Aviso para desconectar al llegar a tu número de arriba y para conectar al bajar al de abajo.
  Tiempo que te queda con tu propio ritmo de gasto, salud de la batería mes a mes y el informe de Windows en palabras simples.
  Modo apagón para los días de cortes y modo Vive conectada para la laptop que nunca se desconecta.
  No corta la carga, no se conecta a internet y no pide permisos de administrador. Solo Windows 10 y 11.
