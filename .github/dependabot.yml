# Keeps the pinned GitHub Actions up to date (opens a pull request; nothing merges by itself).
# All action updates of the week arrive together in one pull request.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
