# Builds the app and the installer on a clean Windows machine for every push and pull request.
# A tag like v6.1.0 also creates a draft release with the installer and its SHA-256.
# Actions are pinned to full commit SHAs; the comment beside each one names its version.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: bash
        run: ./build.sh
      - name: Name the installer and its hash
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev"
          mkdir -p dist
          cp build/installer/CuidaTuBateriaSetup.exe "dist/CuidaTuBateriaSetup-$VERSION.exe"
          (cd dist && sha256sum *.exe > SHA256.txt && cat SHA256.txt)
      # Code signing goes here once the SignPath Foundation accepts the project (free for open source).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuida-tu-bateria
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuida-tu-bateria
          path: dist
      - name: Release notes
        shell: bash
        run: |
          {
            echo "Instalador para Windows 10 y 11. Installer for Windows 10 and 11."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256.txt
            echo '```'
            echo
            echo "Mientras no tenga firma digital, Windows puede mostrar \"Windows protegió tu PC\": Más información, Ejecutar de todas formas."
            echo "Until it is code-signed, Windows may show \"Windows protected your PC\": More info, Run anyway."
          } > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          body_path: notes.md
          files: dist/*
